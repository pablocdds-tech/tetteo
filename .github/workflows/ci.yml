name: Verificação do projeto

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verificacao-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tipos, lint, formatação, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: postgresql://compilacao:compilacao@localhost:5432/tetteo_test

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: compilacao
          POSTGRES_PASSWORD: compilacao
          POSTGRES_DB: tetteo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compilacao -d tetteo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar cliente Prisma
        run: npx prisma generate

      - name: Verificar projeto
        run: npm run check

      - name: Reproduzir histórico de migrations em banco vazio
        run: npx prisma migrate deploy

      - name: Conferir importações, decisões, isolamento e exportação
        run: npx tsx scripts/conferencia-ensaio.ts

      - name: Conferir baixas, conciliação Inter e isolamento financeiro
        env:
          DATABASE_URL_TESTE: ${{ env.DATABASE_URL }}
        run: npx tsx --import ./scripts/ambiente-de-teste.ts --test --test-concurrency=1 src/modules/financeiro/services/bancos.integracao.ts src/modules/financeiro/services/integrado.integracao.ts

      - name: Compilar para produção
        run: npm run build
